name: seg_attendance
description: SEG Hub Attendance Verification System
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  provider: ^6.1.2
  local_auth: ^2.2.0
  nfc_manager: ^4.0.0
  flutter_secure_storage: ^9.2.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/
dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/seg_app.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/seg_app.png"