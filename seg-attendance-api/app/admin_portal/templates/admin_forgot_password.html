{% extends "admin_base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block auth_content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-logo">SEG</div>
        <div class="login-sub">ADMIN PORTAL</div>
        <h1 id="stepTitle">Reset Password</h1>
        <p class="login-desc" id="stepDesc">Enter your admin email</p>

        <!-- Step 1: Email -->
        <div id="step1">
            <label>Email</label>
            <input type="email" id="resetEmail" placeholder="admin@seghana.net" autofocus>
            <button class="submit-btn" onclick="sendResetCode()">Send Reset Code</button>
        </div>

        <!-- Step 2: OTP -->
        <div id="step2" style="display:none;">
            <label>6-Digit Code</label>
            <input type="text" id="resetCode" maxlength="6" placeholder="000000" style="letter-spacing:12px;text-align:center;font-size:20px;">
            <button class="submit-btn" onclick="verifyCode()">Verify Code</button>
            <p style="text-align:center;font-size:12px;color:#666;margin-top:12px;">
                Check your inbox and spam folder
            </p>
        </div>

        <!-- Step 3: New Password -->
        <div id="step3" style="display:none;">
            <label>New Password</label>
            <div class="password-field">
                <input type="password" id="newPw" placeholder="At least 8 chars, letter + number">
                <button type="button" class="eye-btn" onclick="togglePw('newPw', this)">
                    <span>👁</span>
                </button>
            </div>
            <label>Confirm Password</label>
            <div class="password-field">
                <input type="password" id="confirmPw">
                <button type="button" class="eye-btn" onclick="togglePw('confirmPw', this)">
                    <span>👁</span>
                </button>
            </div>
            <button class="submit-btn" onclick="resetPassword()">Reset Password</button>
        </div>

        <div id="messageArea"></div>

        <p class="login-note">
            <a href="{{ url_for('admin_portal.login') }}" style="color:#FF6B00;">← Back to Sign In</a>
        </p>
    </div>
</div>

<script>
let currentEmail = '';
let currentCode = '';

function showMessage(msg, isError = false) {
    document.getElementById('messageArea').innerHTML =
        `<div class="flash flash-${isError ? 'danger' : 'success'}">${msg}</div>`;
    setTimeout(() => {
        document.getElementById('messageArea').innerHTML = '';
    }, 5000);
}

async function sendResetCode() {
    const email = document.getElementById('resetEmail').value.trim().toLowerCase();
    if (!email) return showMessage('Enter email', true);

    try {
        const res = await fetch('/api/admin/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        currentEmail = email;
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
        document.getElementById('stepTitle').textContent = 'Enter Code';
        document.getElementById('stepDesc').textContent = 'Sent to ' + email;
        showMessage('Code sent to your email');
    } catch (e) {
        showMessage(e.message || 'Failed to send code', true);
    }
}

async function verifyCode() {
    const code = document.getElementById('resetCode').value.trim();
    if (!/^\d{6}$/.test(code)) return showMessage('Enter 6-digit code', true);

    try {
        const res = await fetch('/api/admin/verify-reset-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: currentEmail, code }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        currentCode = code;
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        document.getElementById('stepTitle').textContent = 'New Password';
        document.getElementById('stepDesc').textContent = 'Create a new password';
    } catch (e) {
        showMessage(e.message || 'Invalid code', true);
    }
}

async function resetPassword() {
    const newPw = document.getElementById('newPw').value;
    const confirmPw = document.getElementById('confirmPw').value;

    if (newPw.length < 8) return showMessage('Password too short', true);
    if (newPw !== confirmPw) return showMessage('Passwords do not match', true);

    try {
        const res = await fetch('/api/admin/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                email: currentEmail,
                code: currentCode,
                new_password: newPw,
            }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error);

        showMessage('Password reset! Redirecting to login...');
        setTimeout(() => window.location.href = '/admin/login', 2000);
    } catch (e) {
        showMessage(e.message || 'Reset failed', true);
    }
}

function togglePw(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') {
        input.type = 'text';
        btn.querySelector('span').textContent = '👁‍🗨';
    } else {
        input.type = 'password';
        btn.querySelector('span').textContent = '👁';
    }
}
</script>
{% endblock %}
